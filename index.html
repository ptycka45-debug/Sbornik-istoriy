  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --surface-soft: #F4EFEA;
      --text: #2D3436;
      --text-muted: #6E655F;
      --accent: #C97B63;
      --accent-dark: #AE624B;
      --accent-soft: #F9ECE7;
      --sage: #5B9A8B;
      --sage-soft: #E6F2EF;
      --gold: #D99B26;
      --gold-soft: #FDF5E4;
      --danger: #D64545;
      --border: #E8E0D8;
      --shadow: 0 4px 16px rgba(45, 52, 54, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 100px;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .title-wrap {
      min-width: 0;
      flex: 1;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .title-wrap p {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .install-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      height: 42px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(201, 123, 99, 0.34);
      white-space: nowrap;
    }

    .install-btn.visible {
      display: inline-flex;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    /* "On this day" / Memory Banner */
    .memory-banner {
      background: linear-gradient(135deg, var(--gold-soft), var(--accent-soft));
      border: 1px solid #EDD9BC;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .memory-banner:active {
      transform: scale(0.99);
    }

    .memory-banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      color: #9C6B16;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }

    .memory-banner-text {
      font-size: 14px;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Search & Categories */
    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
    }

    .cat-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
      flex: 1;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .manage-cats-btn {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Feed Cards */
    .story-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .story-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .story-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cat-badge {
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .story-date {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .story-title {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .story-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--sage);
      margin-bottom: 8px;
    }

    .story-text {
      font-size: 15px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    .story-text.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .read-more-btn {
      background: none;
      border: none;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 0 0;
      cursor: pointer;
      display: inline-block;
    }

    .story-photo {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 12px;
      display: block;
      cursor: pointer;
    }

    .story-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--surface-soft);
    }

    .story-actions {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-mini.fav-active {
      background: var(--gold-soft);
      border-color: #E7C88B;
      color: #9C6B16;
    }

    .btn-mini.danger {
      color: var(--danger);
    }

    .fab {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 15px 26px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(201, 123, 99, 0.38);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 640px;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Big unrestricted textarea for long stories */
    .field textarea.story-editor {
      min-height: 220px;
      resize: vertical;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .cat-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>📖 Копилка историй</h1>
        <p id="headerCount">Крылатые фразы и тёплые моменты</p>
      </div>
      <div class="header-actions">
        <button class="install-btn" id="installAppBtn">📲 Установить</button>
        <button class="icon-btn" id="randomMemoryBtn" title="Случайное воспоминание">🎲</button>
        <button class="icon-btn" id="backupBtn" title="Резервная копия">💾</button>
      </div>
    </header>

    <div id="memoryBannerContainer"></div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск по фразам, историям, героям..." />
    </div>

    <div class="cat-bar">
      <div class="chips" id="categoryChips"></div>
      <button class="manage-cats-btn" id="openCatsBtn" title="Управление категориями">＋ Категории</button>
    </div>

    <div class="story-list" id="storyList"></div>
  </div>

  <button class="fab" id="addEntryBtn">✍️ Новая запись</button>

  <!-- Add / Edit Entry Modal -->
  <div class="modal-backdrop" id="entryModal">
    <div class="modal">
      <h2 id="entryModalTitle">Новая запись</h2>
      <input type="hidden" id="editEntryId" />

      <div class="field">
        <label>Заголовок (необязательно)</label>
        <input type="text" id="entryTitle" placeholder="Например: Как Коржик осваивал новый трюк..." />
      </div>

      <div class="field" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label>Категория</label>
          <select id="entryCategory"></select>
        </div>
        <div>
          <label>Дата события</label>
          <input type="date" id="entryDate" />
        </div>
      </div>

      <div class="field">
        <label>Кто сказал / участники</label>
        <input type="text" id="entryAuthor" placeholder="Например: Муж, сын, Надюша, коты..." />
      </div>

      <div class="field">
        <label>
          <span>Текст фразы или подробная история</span>
          <span id="charCounter" style="font-weight:400;">0 символов</span>
        </label>
        <textarea id="entryText" class="story-editor" placeholder="Пишите сколько угодно — от одной меткой фразы до длинного рассказа со всеми подробностями..."></textarea>
      </div>

      <div class="field" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <label class="btn-secondary" style="margin:0; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
          📷 Прикрепить фото
          <input type="file" id="entryPhotoInput" accept="image/*" style="display:none;" />
        </label>
        <label style="margin:0; display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text);">
          <input type="checkbox" id="entryFav" style="width:18px; height:18px;" /> ⭐ В золотой фонд
        </label>
      </div>

      <div id="photoPreviewWrap" style="display:none; margin-bottom:12px;">
        <img id="entryPhotoPreview" src="" alt="Фото" style="width:100%; max-height:220px; object-fit:cover; border-radius:14px;" />
        <button type="button" id="removePhotoBtn" style="background:none; border:none; color:var(--danger); font-size:13px; font-weight:700; padding:6px 0; cursor:pointer;">✕ Убрать фото</button>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" id="closeEntryModalBtn" style="flex:1;">Отмена</button>
        <button class="btn-primary" id="saveEntryBtn" style="flex:1;">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Full Reader Modal (for long stories) -->
  <div class="modal-backdrop" id="readerModal">
    <div class="modal">
      <div id="readerContent"></div>
      <div class="modal-footer">
        <button class="btn-secondary" id="readerEditBtn" style="flex:1;">✏️ Редактировать</button>
        <button class="btn-primary" id="closeReaderBtn" style="flex:1;">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Manage Categories Modal -->
  <div class="modal-backdrop" id="catsModal">
    <div class="modal">
      <h2>Категории сборника</h2>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input type="text" id="newCatInput" placeholder="Название новой категории..." style="flex:1; padding:11px 12px; border-radius:12px; border:1px solid var(--border); font-size:15px; background:var(--bg);" />
        <button class="btn-primary" id="addCatBtn" style="flex:0 0 auto; padding:0 18px;">Добавить</button>
      </div>
      <div id="catsList"></div>
      <div class="modal-footer">
        <button class="btn-secondary" id="closeCatsModalBtn" style="width:100%;">Готово</button>
      </div>
    </div>
  </div>

  <!-- Backup Modal -->
  <div class="modal-backdrop" id="backupModal">
    <div class="modal">
      <h2>Резервная копия сборника</h2>
      <p style="font-size:13px; color:var(--text-muted); margin-top:0;">
        Все ваши истории и категории хранятся в памяти устройства. Вы можете выгрузить весь сборник в файл JSON или восстановить его.
      </p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn-primary" id="exportJsonBtn">⬇️ Скачать резервную копию (.json)</button>
        <label class="btn-secondary" style="text-align:center; cursor:pointer;">
          ⬆️ Загрузить из файла (.json)
          <input type="file" id="importJsonInput" accept=".json" style="display:none;" />
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="closeBackupBtn" style="width:100%;">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    // PWA Install Button logic
    let deferredPrompt = null;
    const installBtn = document.getElementById('installAppBtn');

    function isStandaloneMode() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    if (isStandaloneMode()) {
      installBtn.classList.remove('visible');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandaloneMode()) {
        installBtn.classList.add('visible');
      }
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.remove('visible');
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.remove('visible');
      deferredPrompt = null;
    });

    const ENTRIES_KEY = 'story_quotes_entries_v1';
    const CATS_KEY = 'story_quotes_cats_v1';

    function todayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function yearsAgoStr(years) {
      const d = new Date();
      d.setFullYear(d.getFullYear() - years);
      return d.toISOString().split('T')[0];
    }

    const DEFAULT_CATEGORIES = [
      '💬 Крылатые фразы',
      '😂 Смешные случаи',
      '🏡 Семейные истории',
      '🐾 Про пушистых',
      '✨ Тёплые моменты'
    ];

    const DEFAULT_ENTRIES = [
      {
        id: 'e1',
        title: 'Главный закон домашнего уюта',
        category: '💬 Крылатые фразы',
        date: todayStr(),
        author: 'Семейная мудрость',
        text: '«Если день не задался — свари вкусный напиток, обними кота и отложи все подвиги до завтра».',
        favorite: true,
        photo: ''
      },
      {
        id: 'e2',
        title: 'Синхронная инспекция на кухне',
        category: '🐾 Про пушистых',
        date: yearsAgoStr(1),
        author: 'Компот и Коржик',
        text: 'Стоит только достать разделочную доску, как на кухне материализуются два пушистых эксперта по контролю качества. Сидят с таким видом, будто весь день ничего не ели, хотя миски полные ровно десять минут назад.',
        favorite: true,
        photo: ''
      }
    ];

    let categories = loadCategories();
    let entries = loadEntries();
    let activeCategory = 'Все';
    let searchQuery = '';
    let currentPhotoData = '';
    let expandedIds = new Set();

    function loadCategories() {
      try {
        const raw = localStorage.getItem(CATS_KEY);
        if (!raw) {
          localStorage.setItem(CATS_KEY, JSON.stringify(DEFAULT_CATEGORIES));
          return DEFAULT_CATEGORIES;
        }
        return JSON.parse(raw);
      } catch (e) {
        return DEFAULT_CATEGORIES;
      }
    }

    function saveCategories() {
      localStorage.setItem(CATS_KEY, JSON.stringify(categories));
    }

    function loadEntries() {
      try {
        const raw = localStorage.getItem(ENTRIES_KEY);
        if (!raw) {
          localStorage.setItem(ENTRIES_KEY, JSON.stringify(DEFAULT_ENTRIES));
          return DEFAULT_ENTRIES;
        }
        return JSON.parse(raw);
      } catch (e) {
        return DEFAULT_ENTRIES;
      }
    }

    function saveEntries() {
      try {
        localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
      } catch (e) {
        alert('Не хватает памяти браузера (обычно из-за больших фото). Скачайте резервную копию в JSON.');
      }
    }

    function formatDateRu(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderMemoryBanner() {
      const container = document.getElementById('memoryBannerContainer');
      if (!entries.length) {
        container.innerHTML = '';
        return;
      }
      const todayMD = todayStr().slice(5); // MM-DD
      const currentYear = todayStr().slice(0, 4);
      const onThisDay = entries.find(e => e.date && e.date.slice(5) === todayMD && e.date.slice(0, 4) !== currentYear);

      if (onThisDay) {
        const yearsDiff = parseInt(currentYear, 10) - parseInt(onThisDay.date.slice(0, 4), 10);
        container.innerHTML = `
          <div class="memory-banner" onclick="openReader('${onThisDay.id}')">
            <div class="memory-banner-top">
              <span>🕰️ В этот день ${yearsDiff} г. назад (${formatDateRu(onThisDay.date)})</span>
              <span>Открыть →</span>
            </div>
            <div class="memory-banner-text">${escapeHtml(onThisDay.title ? onThisDay.title + ': ' + onThisDay.text : onThisDay.text)}</div>
          </div>
        `;
      } else {
        container.innerHTML = '';
      }
    }

    function render() {
      renderMemoryBanner();
      document.getElementById('headerCount').textContent = `Записей в сборнике: ${entries.length}`;

      // Category chips
      const allCats = ['Все', '⭐ Избранное', ...categories];
      const chipsEl = document.getElementById('categoryChips');
      chipsEl.innerHTML = allCats.map(cat => `
        <button class="chip ${activeCategory === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
      `).join('');

      chipsEl.querySelectorAll('.chip').forEach(btn => {
        btn.onclick = () => {
          activeCategory = btn.dataset.cat;
          render();
        };
      });

      // Filter & sort newest first
      const filtered = entries
        .filter(e => {
          if (activeCategory === '⭐ Избранное' && !e.favorite) return false;
          if (activeCategory !== 'Все' && activeCategory !== '⭐ Избранное' && e.category !== activeCategory) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return (
            (e.title && e.title.toLowerCase().includes(q)) ||
            (e.text && e.text.toLowerCase().includes(q)) ||
            (e.author && e.author.toLowerCase().includes(q)) ||
            (e.category && e.category.toLowerCase().includes(q))
          );
        })
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const listEl = document.getElementById('storyList');
      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">По этому фильтру пока нет записей ✨<br/>Нажмите «Новая запись», чтобы сохранить историю или фразу.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(e => {
        const isLong = (e.text || '').length > 280 || (e.text || '').split('\n').length > 5;
        const isExpanded = expandedIds.has(e.id);
        return `
          <div class="story-card">
            <div class="story-head">
              <span class="cat-badge">${escapeHtml(e.category || 'Без категории')}</span>
              <span class="story-date">${formatDateRu(e.date)}</span>
            </div>

            ${e.title ? `<h3 class="story-title">${escapeHtml(e.title)}</h3>` : ''}
            ${e.author ? `<div class="story-author">— ${escapeHtml(e.author)}</div>` : ''}

            <p class="story-text ${isLong && !isExpanded ? 'collapsed' : ''}">${escapeHtml(e.text)}</p>

            ${isLong ? `
              <button class="read-more-btn" onclick="toggleExpand('${e.id}')">
                ${isExpanded ? 'Свернуть текст ▲' : 'Читать целиком ▼'}
              </button>
            ` : ''}

            ${e.photo ? `<img class="story-photo" src="${e.photo}" alt="Фото" onclick="openReader('${e.id}')" />` : ''}

            <div class="story-footer">
              <button class="btn-mini ${e.favorite ? 'fav-active' : ''}" onclick="toggleFav('${e.id}')">
                ${e.favorite ? '⭐ В избранном' : '☆ В избранное'}
              </button>
              <div class="story-actions">
                <button class="btn-mini" onclick="openReader('${e.id}')" title="Открыть на весь экран">📖</button>
                <button class="btn-mini" onclick="openEditEntry('${e.id}')" title="Редактировать">✏️</button>
                <button class="btn-mini danger" onclick="deleteEntry('${e.id}')" title="Удалить">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleExpand = function(id) {
      if (expandedIds.has(id)) {
        expandedIds.delete(id);
      } else {
        expandedIds.add(id);
      }
      render();
    };

    window.toggleFav = function(id) {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;
      entry.favorite = !entry.favorite;
      saveEntries();
      render();
    };

    window.deleteEntry = function(id) {
      if (!confirm('Удалить эту запись из сборника?')) return;
      entries = entries.filter(e => e.id !== id);
      saveEntries();
      render();
    };

    // Full screen reader modal
    window.openReader = function(id) {
      const e = entries.find(item => item.id === id);
      if (!e) return;
      document.getElementById('readerContent').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span class="cat-badge">${escapeHtml(e.category)}</span>
          <span style="font-size:13px; color:var(--text-muted);">${formatDateRu(e.date)}</span>
        </div>
        ${e.title ? `<h2 style="margin:0 0 8px; font-size:20px;">${escapeHtml(e.title)}</h2>` : ''}
        ${e.author ? `<div class="story-author" style="margin-bottom:12px;">— ${escapeHtml(e.author)}</div>` : ''}
        <div style="font-size:16px; line-height:1.65; white-space:pre-wrap; word-break:break-word;">${escapeHtml(e.text)}</div>
        ${e.photo ? `<img src="${e.photo}" style="width:100%; border-radius:14px; margin-top:14px;" />` : ''}
      `;
      document.getElementById('readerEditBtn').onclick = () => {
        document.getElementById('readerModal').classList.remove('open');
        openEditEntry(e.id);
      };
      document.getElementById('readerModal').classList.add('open');
    };

    document.getElementById('closeReaderBtn').onclick = () => {
      document.getElementById('readerModal').classList.remove('open');
    };

    // Random memory button in header
    document.getElementById('randomMemoryBtn').onclick = () => {
      if (!entries.length) return;
      const random = entries[Math.floor(Math.random() * entries.length)];
      openReader(random.id);
    };

    document.getElementById('searchInput').oninput = (e) => {
      searchQuery = e.target.value.trim();
      render();
    };

    // Add / Edit Entry Modal
    function populateCategorySelect(selectedCat = '') {
      const sel = document.getElementById('entryCategory');
      const list = [...categories];
      if (selectedCat && !list.includes(selectedCat)) {
        list.push(selectedCat);
      }
      sel.innerHTML = list.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (selectedCat) sel.value = selectedCat;
    }

    function updateCharCounter() {
      const len = document.getElementById('entryText').value.length;
      document.getElementById('charCounter').textContent = `${len} симв.`;
    }

    document.getElementById('entryText').oninput = updateCharCounter;

    document.getElementById('addEntryBtn').onclick = () => {
      document.getElementById('entryModalTitle').textContent = 'Новая запись';
      document.getElementById('editEntryId').value = '';
      document.getElementById('entryTitle').value = '';
      populateCategorySelect(activeCategory !== 'Все' && activeCategory !== '⭐ Избранное' ? activeCategory : categories[0]);
      document.getElementById('entryDate').value = todayStr();
      document.getElementById('entryAuthor').value = '';
      document.getElementById('entryText').value = '';
      document.getElementById('entryFav').checked = false;
      currentPhotoData = '';
      document.getElementById('photoPreviewWrap').style.display = 'none';
      updateCharCounter();
      document.getElementById('entryModal').classList.add('open');
    };

    window.openEditEntry = function(id) {
      const e = entries.find(item => item.id === id);
      if (!e) return;
      document.getElementById('entryModalTitle').textContent = 'Редактировать запись';
      document.getElementById('editEntryId').value = e.id;
      document.getElementById('entryTitle').value = e.title || '';
      populateCategorySelect(e.category || categories[0]);
      document.getElementById('entryDate').value = e.date || todayStr();
      document.getElementById('entryAuthor').value = e.author || '';
      document.getElementById('entryText').value = e.text || '';
      document.getElementById('entryFav').checked = !!e.favorite;
      currentPhotoData = e.photo || '';
      if (currentPhotoData) {
        document.getElementById('entryPhotoPreview').src = currentPhotoData;
        document.getElementById('photoPreviewWrap').style.display = 'block';
      } else {
        document.getElementById('photoPreviewWrap').style.display = 'none';
      }
      updateCharCounter();
      document.getElementById('entryModal').classList.add('open');
    };

    document.getElementById('closeEntryModalBtn').onclick = () => {
      document.getElementById('entryModal').classList.remove('open');
    };

    document.getElementById('entryPhotoInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxSide = 800;
          let w = img.width;
          let h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) {
              h = Math.round(h * maxSide / w);
              w = maxSide;
            } else {
              w = Math.round(w * maxSide / h);
              h = maxSide;
            }
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          currentPhotoData = canvas.toDataURL('image/jpeg', 0.82);
          document.getElementById('entryPhotoPreview').src = currentPhotoData;
          document.getElementById('photoPreviewWrap').style.display = 'block';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('removePhotoBtn').onclick = () => {
      currentPhotoData = '';
      document.getElementById('entryPhotoInput').value = '';
      document.getElementById('photoPreviewWrap').style.display = 'none';
    };

    document.getElementById('saveEntryBtn').onclick = () => {
      const id = document.getElementById('editEntryId').value;
      const text = document.getElementById('entryText').value.trim();
      const title = document.getElementById('entryTitle').value.trim();
      if (!text && !title) return alert('Напишите текст истории или заголовок');

      const payload = {
        title,
        category: document.getElementById('entryCategory').value,
        date: document.getElementById('entryDate').value || todayStr(),
        author: document.getElementById('entryAuthor').value.trim(),
        text,
        favorite: document.getElementById('entryFav').checked,
        photo: currentPhotoData
      };

      if (id) {
        const idx = entries.findIndex(e => e.id === id);
        if (idx !== -1) entries[idx] = { ...entries[idx], ...payload };
      } else {
        entries.unshift({ id: 'e_' + Date.now(), ...payload });
      }

      saveEntries();
      document.getElementById('entryModal').classList.remove('open');
      render();
    };

    // Manage Categories Modal
    function renderCatsManager() {
      const list = document.getElementById('catsList');
      list.innerHTML = categories.map((cat, idx) => `
        <div class="cat-list-item">
          <span style="font-weight:600; font-size:15px;">${escapeHtml(cat)}</span>
          <div style="display:flex; gap:6px;">
            <button class="btn-mini" onclick="renameCat(${idx})" title="Переименовать">✏️</button>
            ${categories.length > 1 ? `<button class="btn-mini danger" onclick="deleteCat(${idx})" title="Удалить">🗑️</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('openCatsBtn').onclick = () => {
      renderCatsManager();
      document.getElementById('catsModal').classList.add('open');
    };

    document.getElementById('closeCatsModalBtn').onclick = () => {
      document.getElementById('catsModal').classList.remove('open');
      render();
    };

    document.getElementById('addCatBtn').onclick = () => {
      const input = document.getElementById('newCatInput');
      const val = input.value.trim();
      if (!val) return;
      if (!categories.includes(val)) {
        categories.push(val);
        saveCategories();
        renderCatsManager();
      }
      input.value = '';
    };

    window.renameCat = function(idx) {
      const oldName = categories[idx];
      const nextName = prompt('Новое название категории:', oldName);
      if (!nextName || !nextName.trim() || nextName.trim() === oldName) return;
      const clean = nextName.trim();
      categories[idx] = clean;
      entries.forEach(e => {
        if (e.category === oldName) e.category = clean;
      });
      if (activeCategory === oldName) activeCategory = clean;
      saveCategories();
      saveEntries();
      renderCatsManager();
    };

    window.deleteCat = function(idx) {
      const target = categories[idx];
      if (!confirm(`Удалить категорию «${target}»? Записи из неё сохранятся.`)) return;
      categories.splice(idx, 1);
      if (activeCategory === target) activeCategory = 'Все';
      saveCategories();
      renderCatsManager();
    };

    // Backup Modal
    document.getElementById('backupBtn').onclick = () => document.getElementById('backupModal').classList.add('open');
    document.getElementById('closeBackupBtn').onclick = () => document.getElementById('backupModal').classList.remove('open');

    document.getElementById('exportJsonBtn').onclick = () => {
      const data = { categories, entries };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sbornik-istoriy-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('importJsonInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && Array.isArray(parsed.entries)) {
            entries = parsed.entries;
            if (Array.isArray(parsed.categories) && parsed.categories.length) {
              categories = parsed.categories;
              saveCategories();
            }
            saveEntries();
            render();
            document.getElementById('backupModal').classList.remove('open');
          } else if (Array.isArray(parsed)) {
            entries = parsed;
            saveEntries();
            render();
            document.getElementById('backupModal').classList.remove('open');
          }
        } catch (err) {
          alert('Не удалось прочитать файл резервной копии');
        }
      };
      reader.readAsText(file);
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    render();
  </script>
</body>
</html>
